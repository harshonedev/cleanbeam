# Exercise every control once. Assumes the app is already paired.
appId: io.egate.remoteApp
---
- launchApp
- extendedWaitUntil:
    visible: "EGate Atom3X"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Wi-Fi|Bluetooth"
    timeout: 20000
- takeScreenshot: 01_remote_connected
# D-pad: right, right, down, OK (points are fractions of the screen)
- tapOn:
    point: "79%,37%"
- tapOn:
    point: "79%,37%"
- tapOn:
    point: "50%,50%"
- takeScreenshot: 02_after_dpad
- tapOn: "OK"
- tapOn:
    point: "30%,62%"   # Back
- tapOn:
    point: "50%,62%"   # Home
- takeScreenshot: 03_after_back_home
- tapOn:
    point: "70%,70%"   # volume up
- tapOn:
    point: "30%,70%"   # volume down
# keyboard sheet
- scrollUntilVisible:
    element: "Type"
    direction: DOWN
- tapOn: "Type"
- extendedWaitUntil:
    visible: "Type on the projector"
    timeout: 5000
- inputText: "cric"
- takeScreenshot: 04_keyboard
- pressKey: Enter
- back
# Apps tab
- tapOn: "Apps"
- extendedWaitUntil:
    visible: "YouTube"
    timeout: 15000
- takeScreenshot: 05_apps
- tapOn: "YouTube"
- waitForAnimationToEnd
- tapOn: "Remote"
- extendedWaitUntil:
    visible: "On YouTube"
    timeout: 10000
- takeScreenshot: 06_status_youtube
- tapOn:
    point: "50%,62%"   # Home
# Touchpad
- tapOn: "Touchpad"
- assertVisible: "Drag to move, tap to click,\ntwo fingers to scroll"
- swipe:
    start: "30%,40%"
    end: "70%,60%"
    duration: 600
- tapOn: "Left click"
- takeScreenshot: 07_touchpad
- tapOn: "Remote"
- takeScreenshot: 08_end
