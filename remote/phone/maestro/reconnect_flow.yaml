# After the user toggles Wi-Fi off (Control Centre), the badge must switch to Bluetooth.
appId: io.egate.remoteApp
---
- launchApp
- extendedWaitUntil:
    visible: "Bluetooth"
    timeout: 30000
- takeScreenshot: ble_badge
- tapOn:
    point: "79%,37%"
- tapOn:
    point: "21%,37%"
- takeScreenshot: ble_keys_sent
