# Bluetooth path: run with the phone's Wi-Fi off (adb shell svc wifi disable). The badge must say
# Bluetooth, keys must still move the projector, and status pushes must still arrive.
# Precondition: the projector screen must be ON. Its screen-off timeout is 5 min; once the screen
# is off, screenOn() (PowerManager.isInteractive) is false and the status line reads "Screen off",
# not "On Home", so the first assert fails. Wake it (press a key on the projector or send one from a
# second device) before running, or run within 5 min of last use.
appId: com.cleanyourprojector.phone
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Bluetooth"
    timeout: 40000
- takeScreenshot: ble_01_badge
- tapOn:
    id: "btn-home"
- extendedWaitUntil:
    visible: "On Home"
    timeout: 15000
- tapOn:
    id: "dpad-right"
- tapOn:
    id: "dpad-right"
- takeScreenshot: ble_02_keys
- tapOn:
    text: "Apps.*"   # the tab's accessibility text is "Apps\nTab n of 3"
- extendedWaitUntil:
    visible:
      id: "app-ahaflix.tv"   # first tile: the app list has arrived (letter tiles over BLE)
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "app-com.google.android.youtube.tv"
    direction: DOWN
- tapOn:
    id: "app-com.google.android.youtube.tv"
- tapOn:
    text: "Remote.*"   # the tab's accessibility text is "Remote\nTab n of 3"
- extendedWaitUntil:
    visible: "On YouTube"
    timeout: 20000
- takeScreenshot: ble_03_launch
- tapOn:
    id: "btn-home"
- extendedWaitUntil:
    visible: "On Home"
    timeout: 15000
